name: kanta_slip
description: "Kanta Slip - Modern Weighbridge Slip Management App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^13.2.0
  drift: ^2.16.0
  sqlite3_flutter_libs: ^0.5.21
  path_provider: ^2.1.2
  path: ^1.9.0
  fl_chart: ^0.68.0
  camera: ^0.10.5+9
  google_mlkit_text_recognition: ^0.11.0
  pdf: ^3.10.8
  printing: ^5.13.0
  share_plus: ^9.0.0
  qr_flutter: ^4.1.0
  local_auth: ^2.1.8
  flutter_secure_storage: ^9.0.0
  intl: ^0.19.0
  audioplayers: ^6.0.0
  flutter_tts: ^4.0.2
  image_picker: ^1.0.7
  screen_brightness: ^1.0.1
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.8
  cloud_firestore: ^4.15.8
  firebase_storage: ^11.6.9
  firebase_app_check: ^0.2.1+15
  connectivity_plus: ^5.0.2
  uuid: ^4.3.3
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  drift_dev: ^2.16.0
  build_runner: ^2.4.8
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/signature.png
    - assets/branding/
    - assets/sounds/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: NotoSansDevanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari-Regular.ttf

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/branding/app_icon_dark.png"
  adaptive_icon_background: "#0B0B0C"
  adaptive_icon_foreground: "assets/branding/app_icon_foreground.png"
