name: Generate Keystore Helper

on:
  workflow_dispatch:
    inputs:
      alias:
        description: 'Key Alias'
        required: true
        default: 'kanta_slip_key'
      password:
        description: 'Keystore and Key Password'
        required: true
        default: 'kanta_slip_pass'

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Release Keystore
        run: |
          keytool -genkeypair -v \
            -keystore upload-keystore.jks \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias "${{ github.event.inputs.alias }}" \
            -storepass "${{ github.event.inputs.password }}" \
            -keypass "${{ github.event.inputs.password }}" \
            -dname "CN=Kanta Slip, OU=Mobile, O=Joshi Weighbridge, L=Rawatsar, ST=Rajasthan, C=IN"

          BASE64_KEYSTORE=$(base64 -w 0 upload-keystore.jks)

          echo "=========================================================="
          echo "KEYSTORE GENERATED SUCCESSFULLY!"
          echo "Add the following Secrets in GitHub Repo Settings -> Secrets & Variables -> Actions:"
          echo "1. KEYSTORE_BASE64: [Value generated below]"
          echo "2. KEYSTORE_PASSWORD: [Your input password]"
          echo "3. KEY_ALIAS: ${{ github.event.inputs.alias }}"
          echo "4. KEY_PASSWORD: [Your input password]"
          echo "=========================================================="
          echo "KEYSTORE_BASE64 output length: ${#BASE64_KEYSTORE} chars"
          echo "KEYSTORE_BASE64=$BASE64_KEYSTORE" >> $GITHUB_ENV

      - name: Save Base64 Keystore Artifact
        uses: actions/upload-artifact@v4
        with:
          name: base64-keystore-info
          path: upload-keystore.jks
