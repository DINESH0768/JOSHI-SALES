name: Build Android APKs

on:
  push:
    branches: [ main, master, "**" ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Run Build Runner
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Run Flutter Analyzer
        run: flutter analyze --no-fatal-infos

      - name: Run Unit Tests
        timeout-minutes: 12
        run: flutter test

      - name: Build Debug APK
        if: success() || failure()
        run: flutter build apk --debug

      - name: Upload Debug APK Artifact
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: kanta-slip-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

      - name: Check signing secrets
        id: sign
        if: success() || failure()
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
          KP: ${{ secrets.KEYSTORE_PASSWORD }}
          KA: ${{ secrets.KEY_ALIAS }}
          KKP: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KS" ] && [ -n "$KP" ] && [ -n "$KA" ] && [ -n "$KKP" ]; then
            echo "has_keys=true" >> $GITHUB_OUTPUT
          else
            echo "has_keys=false" >> $GITHUB_OUTPUT
          fi

      - name: Decode Release Keystore
        if: (success() || failure()) && steps.sign.outputs.has_keys == 'true'
        run: echo "$KEYSTORE_BASE64" | base64 --decode > $RUNNER_TEMP/upload-keystore.jks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Build Release APK
        if: (success() || failure()) && steps.sign.outputs.has_keys == 'true'
        run: flutter build apk --release --split-per-abi
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/upload-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload arm64-v8a Release APK Artifact
        if: (success() || failure()) && steps.sign.outputs.has_keys == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-arm64-v8a-release-apk
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
